<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>عرض ملف PDF</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #e5e7eb;
    }

    .error-message {
      max-width: 600px;
      margin: 80px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      line-height: 1.9;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.12);
      color: #dc2626;
      text-align: center;
    }
  </style>
</head>

<body>
  <main id="viewer"></main>

  <script>
    const SUPABASE_URL = "https://kxkkoadoybxhdoxqmeqj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4a2tvYWRveWJ4aGRveHFtZXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDczMjcsImV4cCI6MjA5NTcyMzMyN30.PbXYYeNfsQGIYgGWcemD7QZryxs_xhlkWsAVG-PnC2A";

    const TABLE_NAME = "pdf_documents";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    document.addEventListener("DOMContentLoaded", loadFileFromUrl);

    async function loadFileFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const fileId = params.get("id");

      if (!fileId) {
        showError("رابط غير صحيح. لا يوجد رقم ملف.");
        return;
      }

      const result = await supabaseClient
        .from(TABLE_NAME)
        .select("id, name, public_url, visits")
        .eq("id", fileId)
        .single();

      if (result.error || !result.data) {
        showError("تعذر العثور على الملف.");
        return;
      }

      const file = result.data;

      document.title = file.name;

      increaseVisits(file);

      /*
        هذا هو الحل المهم:
        نفتح ملف PDF الأصلي مباشرة.
        لا Canvas، لا iframe، لا تحويل.
        هذا يعطي أفضل عرض ممكن حسب قارئ PDF في الجهاز.
      */
      window.location.replace(file.public_url);
    }

    async function increaseVisits(file) {
      const nextVisits = Number(file.visits || 0) + 1;

      await supabaseClient
        .from(TABLE_NAME)
        .update({ visits: nextVisits })
        .eq("id", file.id);
    }

    function showError(text) {
      document.getElementById("viewer").innerHTML =
        "<div class='error-message'>" + text + "</div>";
    }
  </script>
</body>
</html>
